<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <title>Snake</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>

<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        "use strict";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        ctx.imageSmoothingEnabled = false;


        const TILE_SIZE = 16;

        const GRID_WIDTH = 16;
        const GRID_HEIGHT = 16;

        const Direction = {
            UP: 0,
            RIGHT: 1,
            DOWN: 2,
            LEFT: 3
        };

        const snakeTiles = new Image();
        snakeTiles.src = "assets/snake_tiles.png";

        const gameTiles = new Image();
        gameTiles.src = "assets/game_tiles.png";

        let snake = [];

        let digestingSegments = [];

        let currentDir = Direction.RIGHT;
        let nextDir = Direction.RIGHT;

        let shouldGrow = false;

        let fruitPos = {
            x: 0,
            y: 0
        };

        let score = 0;

        let topScore = 0;

        let lastScore = 0;

        let moveTimer = 0.35;
        let timeSinceLastMove = 0;

        let easyMode = true;


        let globalScale = 1;

        let gridOffsetX = 0;
        let gridOffsetY = 0;


        let swipeStartX = 0;
        let swipeStartY = 0;

        const swipeThreshold = 100;


        const HIGH_SCORE_KEY = "snake_highscore";


        function init() {

            loadHighscore();

            resizeCanvas();

            initializeBackground();

            resetGame();

            setupInput();

            requestAnimationFrame(gameLoop);
        }


        // ============================================================
        // HIGH SCORE LADEN
        // ============================================================

        function loadHighscore() {

            topScore = parseInt(
                localStorage.getItem(HIGH_SCORE_KEY) || "0",
                10
            );

            lastScore = parseInt(
                localStorage.getItem("snake_lastscore") || "0",
                10
            );
        }


        // ============================================================
        // HIGH SCORE SPEICHERN
        // ============================================================

        function saveHighscore() {

            localStorage.setItem(
                HIGH_SCORE_KEY,
                String(topScore)
            );

            localStorage.setItem(
                "snake_lastscore",
                String(score)
            );
        }


        // ============================================================
        // CANVAS GRÖSSE / SCALE
        // ============================================================

        function resizeCanvas() {

            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            if (windowHeight <= 600) {

                globalScale = 1;

            } else if (windowHeight <= 1080) {

                globalScale = 2;

            } else if (windowHeight <= 2000) {

                globalScale = 3;

            } else {

                globalScale = 4;
            }


            const gameWidth =
                GRID_WIDTH * TILE_SIZE * globalScale;

            const gameHeight =
                GRID_HEIGHT * TILE_SIZE * globalScale;

            canvas.width = windowWidth;
            canvas.height = windowHeight;


            gridOffsetX =
                Math.floor((windowWidth - gameWidth) / 2);

            gridOffsetY =
                Math.floor((windowHeight - gameHeight) / 2);


            ctx.imageSmoothingEnabled = false;
        }

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        // ============================================================
        // GAME LOOP
        // ============================================================

        let lastFrameTime = 0;

        function gameLoop(timestamp) {

            if (lastFrameTime === 0) {
                lastFrameTime = timestamp;
            }

            const delta =
                (timestamp - lastFrameTime) / 1000;

            lastFrameTime = timestamp;


            timeSinceLastMove += delta;


            if (timeSinceLastMove >= moveTimer) {

                timeSinceLastMove = 0;

                updateGame();
            }


            render();


            requestAnimationFrame(gameLoop);
        }


        // ============================================================
        // SPIEL ZURÜCKSETZEN
        // ============================================================

        function resetGame() {

            currentDir = Direction.RIGHT;
            nextDir = Direction.RIGHT;

            snake = [];

            digestingSegments = [];

            shouldGrow = false;

            score = 0;

            moveTimer = 0.35;

            timeSinceLastMove = 0;

            snake.push({
                x: 5,
                y: 5,
                dir: Direction.RIGHT
            });

            snake.push({
                x: 4,
                y: 5,
                dir: Direction.RIGHT
            });

            snake.push({
                x: 3,
                y: 5,
                dir: Direction.RIGHT
            });


            spawnFruit();

            render();
        }


        function updateGame() {

            currentDir = nextDir;


            const head = snake[0];


            const newHead = {
                x: head.x,
                y: head.y,
                dir: currentDir
            };

            switch (currentDir) {

                case Direction.UP:
                    newHead.y--;
                    break;

                case Direction.DOWN:
                    newHead.y++;
                    break;

                case Direction.LEFT:
                    newHead.x--;
                    break;

                case Direction.RIGHT:
                    newHead.x++;
                    break;
            }

            if (easyMode) {

                newHead.x =
                    ((newHead.x + GRID_WIDTH) % GRID_WIDTH);

                newHead.y =
                    ((newHead.y + GRID_HEIGHT) % GRID_HEIGHT);

            } else {

                if (
                    head.x === 0 &&
                    nextDir === Direction.LEFT
                ) {
                    gameOver();
                    return;
                }


                if (
                    head.x === GRID_WIDTH - 1 &&
                    nextDir === Direction.RIGHT
                ) {
                    gameOver();
                    return;
                }


                if (
                    head.y === 0 &&
                    nextDir === Direction.UP
                ) {
                    gameOver();
                    return;
                }


                if (
                    head.y === GRID_HEIGHT - 1 &&
                    nextDir === Direction.DOWN
                ) {
                    gameOver();
                    return;
                }
            }

            if (
                isOccupied(
                    newHead.x,
                    newHead.y
                )
            ) {

                gameOver();

                return;
            }

            snake.unshift(newHead);

            if (
                newHead.x === fruitPos.x &&
                newHead.y === fruitPos.y
            ) {

                shouldGrow = true;

                digestingSegments.push({
                    x: newHead.x,
                    y: newHead.y
                });

                spawnFruit();

                score++;

                moveTimer =
                    Math.max(
                        0.2,
                        moveTimer - 0.001
                    );


                if (score > topScore) {

                    topScore = score;
                }
            }

            if (digestingSegments.length > 0) {

                const lastSegment =
                    snake[snake.length - 1];

                const digestSegment =
                    digestingSegments[0];


                if (
                    digestSegment.x === lastSegment.x &&
                    digestSegment.y === lastSegment.y
                ) {

                    digestingSegments.shift();
                }
            }

            if (!shouldGrow) {

                snake.pop();

            } else {

                shouldGrow = false;
            }


            render();
        }


        // ============================================================
        // RICHTUNG ÄNDERN
        // ============================================================

        function changeDirection(newDirection) {

            if (newDirection === null ||
                newDirection === undefined) {

                return;
            }

            if (
                (newDirection + 2) % 4 !== currentDir
            ) {

                nextDir = newDirection;
            }
        }


        // ============================================================
        // FRUCHT ERZEUGEN
        // ============================================================

        function spawnFruit() {

            while (true) {

                const x =
                    Math.floor(
                        Math.random() * GRID_WIDTH
                    );

                const y =
                    Math.floor(
                        Math.random() * GRID_HEIGHT
                    );


                if (!isOccupied(x, y)) {

                    fruitPos = {
                        x: x,
                        y: y
                    };

                    break;
                }
            }
        }

        function isOccupied(x, y) {

            for (const segment of snake) {

                if (
                    segment.x === x &&
                    segment.y === y
                ) {

                    return true;
                }
            }


            return false;
        }


        // ============================================================
        // GAME OVER
        // ============================================================

        function gameOver() {

            saveHighscore();

            console.log(
                "Game Over - Score:",
                score
            );

            // showGameOverScreen();

        }


        // ============================================================
        // TILE FÜR SNAKE-SEGMENT BESTIMMEN
        // ============================================================

        function getTileForSegment(i) {

            const segment = snake[i];

            if (i === 0) {

                for (
                    let j = 0;
                    j < digestingSegments.length;
                    j++
                ) {

                    const digest =
                        digestingSegments[j];


                    if (
                        digest.x === segment.x &&
                        digest.y === segment.y
                    ) {

                        return {
                            x: segment.dir,
                            y: 1
                        };
                    }
                }


                return {
                    x: segment.dir,
                    y: 0
                };
            }

            if (i === snake.length - 1) {

                return {
                    x: snake[i - 1].dir,
                    y: 4
                };
            }

            const fromDir = segment.dir;
            const toDir = snake[i - 1].dir;

            if (
                (fromDir === Direction.UP &&
                    toDir === Direction.RIGHT) ||

                (fromDir === Direction.LEFT &&
                    toDir === Direction.DOWN)
            ) {

                if (isDigesting(segment)) {

                    return {
                        x: 4,
                        y: 0
                    };
                }


                return {
                    x: 0,
                    y: 2
                };
            }

            if (
                (fromDir === Direction.UP &&
                    toDir === Direction.LEFT) ||

                (fromDir === Direction.RIGHT &&
                    toDir === Direction.DOWN)
            ) {

                if (isDigesting(segment)) {

                    return {
                        x: 4,
                        y: 1
                    };
                }


                return {
                    x: 1,
                    y: 2
                };
            }

            if (
                (fromDir === Direction.DOWN &&
                    toDir === Direction.RIGHT) ||

                (fromDir === Direction.LEFT &&
                    toDir === Direction.UP)
            ) {

                if (isDigesting(segment)) {

                    return {
                        x: 4,
                        y: 2
                    };
                }


                return {
                    x: 2,
                    y: 2
                };
            }

            if (
                (fromDir === Direction.DOWN &&
                    toDir === Direction.LEFT) ||

                (fromDir === Direction.RIGHT &&
                    toDir === Direction.UP)
            ) {

                if (isDigesting(segment)) {

                    return {
                        x: 4,
                        y: 3
                    };
                }


                return {
                    x: 3,
                    y: 2
                };
            }

            if (
                (fromDir === Direction.UP &&
                    toDir === Direction.UP) ||

                (fromDir === Direction.DOWN &&
                    toDir === Direction.DOWN)
            ) {

                if (isDigesting(segment)) {

                    return {
                        x: 3,
                        y: 3
                    };
                }


                return {
                    x: 1,
                    y: 3
                };
            }

            if (
                (fromDir === Direction.LEFT &&
                    toDir === Direction.LEFT) ||

                (fromDir === Direction.RIGHT &&
                    toDir === Direction.RIGHT)
            ) {

                if (isDigesting(segment)) {

                    return {
                        x: 2,
                        y: 3
                    };
                }


                return {
                    x: 0,
                    y: 3
                };
            }

            return {
                x: 4,
                y: 4
            };
        }


        // ============================================================
        // VERDAUUNGSPRÜFUNG
        // ============================================================

        function isDigesting(segment) {

            for (const digest of digestingSegments) {

                if (
                    digest.x === segment.x &&
                    digest.y === segment.y
                ) {

                    return true;
                }
            }


            return false;
        }

        // ============================================================
        // RENDERING
        // ============================================================

        function render() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawBackground();

            drawFruit();

            for (
                let i = 0;
                i < snake.length;
                i++
            ) {

                drawSnakeSegment(i);
            }

            drawScore();
        }


        // ============================================================
        // BACKGROUND
        // ============================================================

        let backgroundTiles = [];

        function initializeBackground() {

            backgroundTiles = [];

            const isDay = Math.random() < 0.5;

            const tiles = isDay
                ? [
                    { x: 0, y: 3 },
                    { x: 1, y: 3 }
                ]
                : [
                    { x: 0, y: 2 },
                    { x: 1, y: 2 }
                ];


            for (let x = 0; x < GRID_WIDTH; x++) {

                for (let y = 0; y < GRID_HEIGHT; y++) {

                    const tile =
                        Math.random() < 0.15
                            ? tiles[0]
                            : tiles[1];


                    backgroundTiles.push({
                        x: x,
                        y: y,
                        tileX: tile.x,
                        tileY: tile.y
                    });
                }
            }
        }

        function drawBackground() {

            for (const tile of backgroundTiles) {

                drawTile(
                    gameTiles,
                    tile.tileX,
                    tile.tileY,
                    tile.x,
                    tile.y
                );
            }
        }


        // ============================================================
        // FRUCHT ZEICHNEN
        // ============================================================

        function drawFruit() {

            drawTile(
                gameTiles,
                0,
                0,
                fruitPos.x,
                fruitPos.y
            );
        }


        // ============================================================
        // SNAKE SEGMENT ZEICHNEN
        // ============================================================

        function drawSnakeSegment(i) {

            const segment =
                snake[i];

            const tile =
                getTileForSegment(i);


            drawTile(
                snakeTiles,
                tile.x,
                tile.y,
                segment.x,
                segment.y
            );
        }


        // ============================================================
        // TILE ZEICHNEN
        // ============================================================

        function drawTile(
            image,
            tileX,
            tileY,
            gridX,
            gridY
        ) {

            const sourceX =
                tileX * TILE_SIZE;

            const sourceY =
                tileY * TILE_SIZE;


            const destinationX =
                gridOffsetX +
                gridX * TILE_SIZE * globalScale;

            const destinationY =
                gridOffsetY +
                gridY * TILE_SIZE * globalScale;


            const destinationSize =
                TILE_SIZE * globalScale;


            ctx.drawImage(
                image,

                sourceX,
                sourceY,
                TILE_SIZE,
                TILE_SIZE,

                destinationX,
                destinationY,
                destinationSize,
                destinationSize
            );
        }


        // ============================================================
        // SCORE
        // ============================================================

        function drawScore() {

            /*
             * Vorläufig direkt als Canvas-Text.
             *
             * Deine Godot-Version hatte dafür:
             *
             * ScoreIcons
             * ScoreValue
             * HighscoreValue
             *
             * Das können wir später ebenfalls pixelgenau
             * über ein Tileset oder eine Schrift lösen.
             */

            const fontSize =
                16 * globalScale;


            ctx.font =
                `${fontSize}px monospace`;

            ctx.textBaseline = "top";


            const scoreY =
                gridOffsetY -
                TILE_SIZE * globalScale;


            ctx.fillText(
                String(score),
                gridOffsetX +
                TILE_SIZE * globalScale,
                scoreY
            );


            ctx.fillText(
                String(topScore),
                gridOffsetX +
                TILE_SIZE * globalScale * 5,
                scoreY
            );
        }


        // ============================================================
        // TASTATUR
        // ============================================================

        function setupInput() {

            window.addEventListener(
                "keydown",
                event => {

                    switch (event.key) {

                        case "ArrowUp":
                            changeDirection(Direction.UP);
                            event.preventDefault();
                            break;

                        case "ArrowDown":
                            changeDirection(Direction.DOWN);
                            event.preventDefault();
                            break;

                        case "ArrowLeft":
                            changeDirection(Direction.LEFT);
                            event.preventDefault();
                            break;

                        case "ArrowRight":
                            changeDirection(Direction.RIGHT);
                            event.preventDefault();
                            break;
                    }
                }
            );


            setupTouchInput();
        }


        // ============================================================
        // TOUCH / SWIPE
        // ============================================================

        function setupTouchInput() {

            canvas.addEventListener(
                "touchstart",
                event => {

                    if (event.touches.length === 0) {
                        return;
                    }


                    const touch =
                        event.touches[0];


                    swipeStartX =
                        touch.clientX;

                    swipeStartY =
                        touch.clientY;

                },
                {
                    passive: true
                }
            );


            canvas.addEventListener(
                "touchend",
                event => {

                    if (event.changedTouches.length === 0) {
                        return;
                    }


                    const touch =
                        event.changedTouches[0];


                    const swipeEndX =
                        touch.clientX;

                    const swipeEndY =
                        touch.clientY;


                    detectSwipe(
                        swipeStartX,
                        swipeStartY,
                        swipeEndX,
                        swipeEndY
                    );
                },
                {
                    passive: true
                }
            );
        }


        // ============================================================
        // SWIPE ERKENNEN
        // ============================================================

        function detectSwipe(
            startX,
            startY,
            endX,
            endY
        ) {

            const swipeX =
                endX - startX;

            const swipeY =
                endY - startY;


            /*
             * Entspricht deinem Godot-Code:
             *
             * if abs(x) > 100
             *     horizontal
             *
             * elif abs(y) > 100
             *     vertical
             */

            if (
                Math.abs(swipeX) >
                swipeThreshold
            ) {

                if (swipeX > 0) {

                    changeDirection(
                        Direction.RIGHT
                    );

                } else {

                    changeDirection(
                        Direction.LEFT
                    );
                }

            } else if (
                Math.abs(swipeY) >
                swipeThreshold
            ) {

                if (swipeY > 0) {

                    changeDirection(
                        Direction.DOWN
                    );

                } else {

                    changeDirection(
                        Direction.UP
                    );
                }
            }
        }


        // ============================================================
        // START
        // ============================================================

        /*
         * Warten, bis die Bilder geladen sind.
         */

        let snakeReady = false;
        let gameReady = false;


        snakeTiles.onload = () => {

            snakeReady = true;

            startWhenReady();
        };


        gameTiles.onload = () => {

            gameReady = true;

            startWhenReady();
        };


        function startWhenReady() {

            if (
                snakeReady &&
                gameReady
            ) {

                init();
            }
        }
    </script>

</body>

</html>
